name: Verificar aplicación
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/octubre-aprendizaje-movil'
        with:
          name: auditoria-2026-10
          path: docs/auditoria-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trazas-navegador
          path: test-results/
          retention-days: 7
