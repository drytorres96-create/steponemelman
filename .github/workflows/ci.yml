name: Verificar aplicación
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Checkout visual baseline (synthetic fixtures only)
        if: always() && steps.browser.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ef9e3c21514b11a9fd4791cce618e03acdae244b
          path: work/navbar-before
          persist-credentials: false
      - name: Compare navigation before and after
        if: always() && steps.browser.outcome == 'success'
        run: node qa/navbar-review.mjs
      - name: Navigation visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-before-after
          path: work/navbar-review/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/octubre-aprendizaje-movil'
        with:
          name: auditoria-2026-10
          path: docs/auditoria-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'mejora/dominio-mantenimiento-premium'
        with:
          name: mejora-dominio-premium-2026-10
          path: docs/mejora-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'mejora/ia-gratuita-eficiente'
        with:
          name: ia-recuperacion-melman-2026-10
          path: docs/ia-recuperacion-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trazas-navegador
          path: test-results/
          retention-days: 7
