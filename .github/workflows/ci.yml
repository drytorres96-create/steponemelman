name: Verificar aplicación
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Verify integrated My Q Bank screens
        run: node qa/myqbank-review.mjs
      # One-time visual rollout: compare the same synthetic scenes with release 1.43.0.
      - name: Checkout My Q Bank design baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'design/suave-motion-2026-10-30'
        uses: actions/checkout@v4
        with:
          ref: de13549b89ce361b3027a802ac42885b378c9c42
          path: work/myqbank-before
          persist-credentials: false
      - name: Capture My Q Bank design baseline with the same fixtures
        if: github.event_name == 'pull_request' && github.head_ref == 'design/suave-motion-2026-10-30'
        working-directory: work/myqbank-before
        env:
          MYQBANK_EVIDENCE_DIR: ${{ github.workspace }}/docs/myqbank-phases-2-4
          MYQBANK_EVIDENCE_PHASE: before
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node "$GITHUB_WORKSPACE/qa/myqbank-review.mjs"
      - name: Integrated My Q Bank application and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myqbank-phases-2-4
          path: |
            dist/
            docs/myqbank-phases-2-4/
          retention-days: 14
      - name: Build isolated My Q Bank preview
        run: npm run build:myqbank
      - name: Verify My Q Bank preview
        run: npm run e2e:myqbank
      - name: My Q Bank preview and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myqbank-phase-1-preview
          path: |
            dist-myqbank/
            test-results/myqbank/
          retention-days: 14
      - name: Checkout visual baseline (synthetic fixtures only)
        if: always() && steps.browser.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ef9e3c21514b11a9fd4791cce618e03acdae244b
          path: work/navbar-before
          persist-credentials: false
      - name: Compare navigation before and after
        if: always() && steps.browser.outcome == 'success'
        run: node qa/navbar-review.mjs
      - name: Navigation visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-before-after
          path: work/navbar-review/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/octubre-aprendizaje-movil'
        with:
          name: auditoria-2026-10
          path: docs/auditoria-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'mejora/dominio-mantenimiento-premium'
        with:
          name: mejora-dominio-premium-2026-10
          path: docs/mejora-2026-10/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trazas-navegador
          path: test-results/
          retention-days: 7
